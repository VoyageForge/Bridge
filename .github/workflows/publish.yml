name: Publish Bridge

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version to release (optional, leave empty to auto patch increment)"
        required: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PACKAGE_JSON_PATH: package.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install semver
        run: npm install -g semver

      - name: Determine version
        id: version
        shell: bash
        run: |
          INPUT_VER="${{ github.event.inputs.release_version }}"
          if [ -n "$INPUT_VER" ]; then
            NEW_VER="$INPUT_VER"
          else
            CURRENT_VER=$(node -p "require('./${PACKAGE_JSON_PATH}').version")
            NEW_VER=$(npx semver "$CURRENT_VER" -i patch)
          fi
          echo "Determined version: $NEW_VER"
          echo "new_version=$NEW_VER" >> "$GITHUB_OUTPUT"

      - name: Update Depot dependency
        shell: bash
        run: |
          echo "Fetching latest Voyage Depot version..."
          DEPOT_VER=$(git ls-remote --tags https://github.com/VoyageForge/Depot.git \
            | grep -o 'refs/tags/v[0-9.]*' | sort -V | tail -n 1 | sed 's/refs\/tags\/v//')

          if [ -z "$DEPOT_VER" ]; then
            echo "Failed to determine latest Voyage Depot version."
            exit 1
          fi

          echo "Found latest Voyage Depot version: $DEPOT_VER"
          node -e "let fs=require('fs'); let p=require('./${PACKAGE_JSON_PATH}'); p.dependencies['com.voyageforge.depot'] = '${DEPOT_VER}'; fs.writeFileSync('${PACKAGE_JSON_PATH}', JSON.stringify(p, null, 2) + '\n');"

      - name: Update package version
        shell: bash
        run: |
          NEW_VER="${{ steps.version.outputs.new_version }}"
          echo "Setting ${PACKAGE_JSON_PATH} version to $NEW_VER"
          node -e "let fs=require('fs'); let p=require('./${PACKAGE_JSON_PATH}'); p.version='${NEW_VER}'; fs.writeFileSync('${PACKAGE_JSON_PATH}', JSON.stringify(p, null, 2) + '\n');"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add "${PACKAGE_JSON_PATH}"
          git commit -m "chore(bridge): set version to ${NEW_VER}" || echo "No changes to commit"
          git push origin HEAD:main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          name: "Bridge v${{ steps.version.outputs.new_version }}"
          body: "Release v${{ steps.version.outputs.new_version }}"
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify version
        shell: bash
        run: |
          PKG_VER=$(node -p "require('./${PACKAGE_JSON_PATH}').version")
          TAG_VER="${{ steps.version.outputs.new_version }}"
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "Version mismatch!"
            exit 1
          fi
          echo "Version successfully synced with tag."

      - name: Done
        run: echo "Publish pipeline completed successfully. CHANGELOG.md is maintained manually. OpenUPM will automatically build the new version once the tag is pushed."
